openapi: 3.0.3
info:
  title: Academia-Industry Collaboration Platform API
  version: 1.0.0
  description: OpenAPI 3.0 Specification for Portal REST Services.
paths:
  /api/v1/auth/login/:
    post:
      summary: Authenticate user and issue JWT tokens
      responses:
        '200':
          description: Successful authentication
  /api/v1/opportunities/:
    get:
      summary: List all published opportunities
      responses:
        '200':
          description: List of opportunities
